#cloud-config
# Hetzner server bootstrap for godo.
# Installs Docker Engine + compose plugin and prepares the app directory.
# The first deploy clones the repo into /opt/godo and runs docker compose;
# subsequent deploys are handled by the GitHub Actions workflow.
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git

runcmd:
  # Install Docker Engine + compose plugin from Docker's official repo
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - mkdir -p /opt/godo
